[package]
name = "auger"
version = "0.3.0"
edition = "2024"
description = "Load test, discover and inspect HTTP endpoints from the terminal"
license = "MIT"
repository = "https://github.com/user123cy/auger"
keywords = ["load-testing", "http", "cli", "benchmark", "security"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
colored = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset", "macos-system-configuration"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
x509-parser = "0.17"
