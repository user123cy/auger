[package]
name = "auger"
version = "0.2.0"
edition = "2024"
description = "Load test, discover and inspect HTTP endpoints from the terminal"
license = "MIT"
repository = "https://github.com/user123cy/auger"
keywords = ["load-testing", "http", "cli", "benchmark", "security"]
categories = ["command-line-utilities", "development-tools::testing"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
colored = "2"
reqwest = "0.12"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net"] }
tokio-rustls = "0.26"
webpki-roots = "0.26"
x509-parser = "0.17"
