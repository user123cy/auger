name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - run: cargo build --release --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          case "${{ matrix.target }}" in
            *pc-windows-msvc)
              tar -a -c -f "dist/auger-${{ matrix.target }}.zip" \
                -C "target/${{ matrix.target }}/release" auger.exe
              ;;
            *)
              tar -a -c -f "dist/auger-${{ matrix.target }}.tar.gz" \
                -C "target/${{ matrix.target }}/release" auger
              ;;
          esac
          cd dist
          sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
